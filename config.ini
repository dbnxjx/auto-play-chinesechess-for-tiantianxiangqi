[General]
# 是否通过 ADB 控制 Android 设备
use_adb = true

# 截屏间隔时间（秒）
interval = 1.6

# 稳定性检查延迟（秒）
stability_delay = 0.2

# 图像差异阈值
image_diff_threshold = 2.0

[Models]
# 路径均相对项目根目录
yolo_model_path = app/assets/models/board_detector.pt

# YOLO置信度阈值
yolo_confidence = 0.5

cell_model_path = app/assets/models/cell_classifier_3class.pth
piece_model_path = app/assets/models/piece_classifier_15class.pth
marker_model_path = app/assets/models/marker_classifier_2class.pth

[AI]
# AI思考时间（秒）
think_time = 0.4

[Click]
# 点击后延迟（秒）
click_delay = 0.2

[ADB]
# ADB路径
adb_path = D:\lots_of_app\adb\adb.exe

[Engine]
engine_path = vendor/pikafish/pikafish-bmi2.exe
nnue_path = vendor/pikafish/pikafish.nnue
